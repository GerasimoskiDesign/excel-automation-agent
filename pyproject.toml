[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlagent"
version = "0.1.0"
description = "An AI agent that interviews a colleague about a manual Excel task, writes a Python script, tests it in a sandbox and packages it as a double-click tool."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mario Gerasimoski" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
    "matplotlib>=3.8",
]
docs = [
    "playwright>=1.44",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xlagent = ["fixtures/cassettes/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/fixture_sources/**" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]
