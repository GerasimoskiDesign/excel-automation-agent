name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      XLAGENT_REPLAY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Debug xlsx diff (temporary)
        run: |
          python -m xlagent examples --out /tmp/regen
          for f in $(cd examples && find . -name '*.xlsx' | sort); do
            if ! cmp -s "examples/$f" "/tmp/regen/$f"; then
              echo "DIFF $f"
              mkdir -p /tmp/a /tmp/b && rm -rf /tmp/a/* /tmp/b/*
              (cd /tmp/a && unzip -q -o "$GITHUB_WORKSPACE/examples/$f")
              (cd /tmp/b && unzip -q -o "/tmp/regen/$f")
              diff -r /tmp/a /tmp/b | head -c 1500 || true
            fi
          done
      - name: Pytest
        run: pytest
      - name: Eval (replay mode, no API key)
        run: python -m xlagent eval
